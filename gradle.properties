# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
# This is required to provide enough memory for the Minecraft decompilation process.
org.gradle.java.home=C:\\Program Files\\Java\\jdk-21
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# Environment Properties
# You can setup the workspace by running: gradle sync
# Note: the non-default values are documented in the NeoGradle user docs. You should probably be using them.
neo_version=21.1.244
# Parchment is an unofficial project maintained by ParchmentMC. It aims to provide better parameter names and javadocs.
# You should use the latest version matching your Minecraft version.
# parchment_minecraft_version=1.21.1
# parchment_mappings_version=2024.11.17

# The Minecraft version must agree with the NeoForge version to get a valid artifact
minecraft_version=1.21.1
# The Minecraft version range can use any release version of Minecraft as bounds.
# Snapshots, pre-releases, and release candidates are not guaranteed to sort properly
# as they do not follow standard versioning semantics.
minecraft_version_range=[1.21.1,1.22)
# The NeoForge version must agree with the Minecraft version to get a valid artifact
neo_version_range=[21.1.0,21.2)
# The loader version range can only use the major version of FML as bounds
loader_version_range=[4,)

## Mod Properties

# The unique mod identifier for the mod. Must be lowercase, alphanumeric separated by underscores.
# This is used to identify the mod in the mod list, for dependencies, and in the file name.
mod_id=dimensionalripper
# The human-readable display name for the mod.
mod_name=Dimensional Ripper
# The license of the mod. Review your options at https://choosealicense.com/. All Rights Reserved is the default.
mod_license=MIT
# The mod version. See https://semver.org/
mod_version=1.1.1
# The group ID for the mod. It is only important when publishing build artifacts to Maven.
mod_group_id=dev.modzuozhi
# The authors of the mod. This is a simple text string that is used for display purposes in the mod list.
mod_authors=YourNameHere
# The description of the mod. This is a simple text string that is used for display purposes in the mod list.
mod_description=Multi-threaded dimension parallel optimization: independent per-dimension tick loops, fine-grained parallel ticking for entities/block entities/chunks, collision optimization, and asynchronous portal teleportation support (vanilla nether/end and mod dimensions like Twilight Forest/Aether).

